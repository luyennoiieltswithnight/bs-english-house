<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - B's English House</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800;900&display=swap" rel="stylesheet">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Nunito', sans-serif; }
        
        body {
            background-color: #7A9051;
            background-image: linear-gradient(rgba(255, 255, 255, 0.15) 1px, transparent 1px), linear-gradient(90deg, rgba(255, 255, 255, 0.15) 1px, transparent 1px);
            background-size: 40px 40px;
            display: flex; justify-content: center; align-items: center; height: 100vh;
        }

        .login-box {
            background: white; padding: 40px; border-radius: 20px;
            text-align: center; border: 4px solid #111; box-shadow: 8px 8px 0px #111;
            max-width: 400px; width: 90%;
        }

        .login-box h1 { color: #2B4214; margin-bottom: 10px; font-weight: 900; }
        .login-box p { color: #555; margin-bottom: 30px; }

        .btn-google {
            display: flex; align-items: center; justify-content: center; gap: 10px;
            background: white; color: #333; padding: 12px 20px; border-radius: 30px;
            border: 2px solid #ddd; font-size: 16px; font-weight: 700; cursor: pointer;
            width: 100%; transition: all 0.2s;
        }
        .btn-google:hover { background: #f1f3f4; border-color: #ccc; }
        .back-link { display: block; margin-top: 20px; color: #7A9051; text-decoration: none; font-weight: bold; }
        .back-link:hover { text-decoration: underline; }
    </style>

    <!-- TÍCH HỢP FIREBASE AUTH VÀ FIRESTORE -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
        
        // Thêm thư viện Firestore
        import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDuoosjvJe3EoF22h9UJ6M95os5s_boQ-o",
            authDomain: "b-s-english-house.firebaseapp.com",
            projectId: "b-s-english-house",
            storageBucket: "b-s-english-house.firebasestorage.app",
            messagingSenderId: "946574286636",
            appId: "1:946574286636:web:44624fb938e6b5dc961689",
            measurementId: "G-YZR2QFWQGR"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app); // Khởi động Firestore
        const provider = new GoogleAuthProvider();

        document.getElementById('loginBtn').addEventListener('click', () => {
            signInWithPopup(auth, provider)
                .then(async (result) => {
                    const user = result.user;
                    const email = user.email;

                    // KIỂM TRA & CẬP NHẬT DỮ LIỆU VÀO FIRESTORE
                    const userRef = doc(db, "users", email); // Tìm kiếm email này trong bảng users
                    const userSnap = await getDoc(userRef);

                    let userRole = "student"; // Mặc định ai mới vào cũng là học sinh

                    if (userSnap.exists()) {
                        // Nếu đã có tên trong sổ (như tài khoản nightruan31 của bạn), thì lấy quyền hiện tại của họ
                        userRole = userSnap.data().role; 
                    } else {
                        // Nếu chưa có (tài khoản mới toanh), thì ghi đè tên họ vào sổ và gán quyền student
                        await setDoc(userRef, {
                            name: user.displayName,
                            email: email,
                            role: "student",
                            createdAt: new Date() // Lưu luôn ngày tháng đăng ký
                        });
                    }

                    // Lưu thông tin vào bộ nhớ tạm của máy tính để trang index.html xài
                    localStorage.setItem('userName', user.displayName);
                    localStorage.setItem('userEmail', email);
                    localStorage.setItem('userPhoto', user.photoURL);
                    localStorage.setItem('userRole', userRole); // Quan trọng: LƯU QUYỀN ĐỂ PHÂN LOẠI

                    alert(`Đăng nhập thành công! Vai trò của bạn là: ${userRole.toUpperCase()}`);
                    window.location.href = "index.html";
                })
                .catch((error) => {
                    console.error("Lỗi đăng nhập: ", error);
                    alert("Đăng nhập thất bại. Vui lòng thử lại!");
                });
        });
    </script>
</head>
<body>
    <div class="login-box">
        <h1>🐾 Welcome!</h1>
        <p>Đăng nhập để lưu lại tiến độ học tập và kết quả bài làm của bạn nhé.</p>
        
        <button id="loginBtn" class="btn-google">
            <svg width="20" height="20" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
                <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
                <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
            </svg>
            Đăng nhập bằng Google
        </button>
        <a href="index.html" class="back-link">⬅ Quay lại Trang chủ</a>
    </div>
</body>
</html>
